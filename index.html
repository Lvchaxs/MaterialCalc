<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>LvchaxsBS 材料计算器</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#8FAEA6">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">LvchaxsBS<span class="sub">材料计算器</span></div>
        <div class="tools">
            <button id="btn-theme" title="切换深浅主题">主题</button>
            <button id="btn-import">导入</button>
            <button id="btn-export">导出</button>
        </div>
    </header>

    <section class="controls">
        <!-- 排序：照抄 LvchaxsBS 怪物材料页的 SortOptionButtonStyle
             （默认/进度 ｜ 升序/降序 ｜ 隐藏100%），★ 平铺显示，不套那个可折叠的「排序 ‹」 -->
        <div class="sort-bar" id="sort-bar">
            <button class="sort-opt" data-k="mode" data-v="0">默认</button>
            <button class="sort-opt" data-k="mode" data-v="1">进度</button>
            <span class="sep"></span>
            <button class="sort-opt" data-k="dir" data-v="0">升序</button>
            <button class="sort-opt" data-k="dir" data-v="1">降序</button>
            <span class="sep"></span>
            <button class="sort-opt" data-k="hide" data-v="1">隐藏100%</button>
        </div>
    </section>

    <main id="list"></main>

    <button id="update-chip" class="chip" hidden>新版本已就绪 · 点击刷新</button>
    <div id="toast" class="toast"></div>

    <input type="file" id="file" accept=".json,application/json" hidden>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
